# Companies to watch. JobPilot reads their PUBLIC job-board APIs (Greenhouse, Lever, Ashby),
# which these companies publish for exactly this purpose. It does not scrape LinkedIn or Handshake.
#
# How to find a company's board name: open its careers page and look at the job link.
#   https://boards.greenhouse.io/<name>/...   or job-boards.greenhouse.io/<name>  -> greenhouse
#   https://jobs.lever.co/<name>/...                                              -> lever
#   https://jobs.ashbyhq.com/<name>/...                                           -> ashby
# A wrong name is skipped with a warning; it won't stop the others.

greenhouse:
  - anthropic
  - databricks
  - scaleai
  - figma
  - stripe
  - robinhood
  - discord
  - instacart
  - pinterest
  - airbnb

lever:
  - plaid
  - palantir
  - mistral

ashby:
  - brainco
  - notion
  - openai
  - ramp
  - cohere
  - perplexity

# Searching beyond the companies above (`python -m jobpilot discover` or the Discover button).
discover:
  newgrad_list: true      # SimplifyJobs New-Grad-Positions (GitHub, ~3,000 active roles, updated daily)
  hn_whos_hiring: true    # Hacker News monthly "Who is hiring?" thread
  days: 14                # only roles posted in the last N days
  us_only: true

# Only titles matching one of these are kept (case-insensitive).
include_titles:
  - machine learning
  - ml engineer
  - " ai "
  - ai engineer
  - applied ai
  - applied scientist
  - data scientist
  - nlp
  - llm
  - research engineer
  - computer vision
  - deep learning
  - software engineer, new grad
  - software engineer new grad
  - software engineer - new grad
  - new grad software
  - software development engineer i

# Titles matching any of these are dropped.
exclude_titles:
  - senior
  - sr.
  - staff
  - principal
  - lead
  - manager
  - director
  - head of
  - intern
  - " ii"
  - " iii"
  - phd
  - annotator
  - annotation
  - ai training
  - ai trainer
  - contributor
  - recording
  - tutor
