<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobPilot</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#5d6678; --line:#e3e6ec; --accent:#1F3864;
          --strong:#1d7a46; --possible:#9a6b00; --weak:#7a7f8c; --skip:#b4352f; --chip:#eef1f6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --card:#1a1f27; --text:#e7eaf0; --muted:#9aa3b5;
          --line:#2a313d; --accent:#8fb0ff; --strong:#5fd18f; --possible:#e5b34a; --weak:#9aa3b5; --skip:#ff7a70; --chip:#232a35; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header a.brand { font-weight:700; color:var(--accent); text-decoration:none; font-size:18px; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  a { color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .btn, button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; font:inherit; cursor:pointer; text-decoration:none; display:inline-block; }
  @media (prefers-color-scheme: dark) { .btn, button { color:#0d1117; } }
  .btn.secondary, button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  input, select, textarea { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--text); width:100%; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  .verdict { font-weight:700; } .Strong { color:var(--strong); } .Possible { color:var(--possible); } .Weak { color:var(--weak); } .Skip { color:var(--skip); } .Unchecked { color:var(--muted); }
  .chip { display:inline-block; background:var(--chip); border-radius:999px; padding:2px 10px; margin:2px 4px 2px 0; font-size:13px; }
  .chips a { text-decoration:none; }
  .muted { color:var(--muted); }
  .flash { background:var(--chip); border-left:4px solid var(--accent); padding:10px 12px; border-radius:6px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
  ul.tight { margin:4px 0 0; padding-left:18px; }
  pre.jd { white-space:pre-wrap; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace; max-height:420px; overflow:auto; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  @media (max-width:700px) { .hide-sm { display:none; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('index') }}">JobPilot</a>
  <a href="{{ url_for('index') }}">Jobs</a>
  <a href="{{ url_for('add') }}">Add a job</a>
  <span class="muted" style="margin-left:auto">Prepares everything. You click Submit.</span>
</header>
<main>
  {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
